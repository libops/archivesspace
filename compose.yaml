---
x-common: &common
  restart: unless-stopped
  networks:
    default:

networks:
  default:

volumes:
  archivesspace-data: {}
  mariadb-data: {}
  solr-data: {}

secrets:
  DB_ROOT_PASSWORD:
    file: ./secrets/DB_ROOT_PASSWORD
  ARCHIVESSPACE_DB_PASSWORD:
    file: ./secrets/ARCHIVESSPACE_DB_PASSWORD

services:
  init:
    image: libops/base:3.2.2.0@sha256:dcbc45a6f61b41d6e849c8920ebca58f26cd65414b3efafbaabc5d04fa95af9d
    restart: "no"
    working_dir: /work
    environment:
      COMPOSE_FILE: /work/compose.yaml
      SECRETS_ROOT: /work/secrets
    volumes:
      - ./certs:/work/certs:rw,z
      - ./secrets:/work/secrets:rw,z
      - ./compose.yaml:/work/compose.yaml:ro,z
    entrypoint: generate-compose-secrets.sh
    profiles: [none]

  traefik:
    <<: *common
    image: traefik:v3.7.13@sha256:f86a2cab1b5c649070c49f883c743dd32d8485a56e3368c5f93b9e91f1e91259
    command:
      - --ping=true
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.transport.respondingTimeouts.readTimeout=300s
    ports:
      - "80:80"
    volumes:
      - ./conf/traefik:/etc/traefik/dynamic:ro,z
    depends_on:
      archivesspace:
        condition: service_healthy
    healthcheck:
      test: traefik healthcheck --ping
      start_period: 10s

  archivesspace:
    <<: *common
    build:
      context: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPACE_DB_MIGRATE: "${ASPACE_DB_MIGRATE:-true}"
      ASPACE_JAVA_XMX: "${ASPACE_JAVA_XMX:--Xmx2048m}"
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: "${DB_NAME:-archivesspace}"
      DB_USER: "${DB_USER:-archivesspace}"
      INGRESS_HOSTNAMES: "localhost"
      INGRESS_SCHEME: "http"
      JAVA_OPTS: "${JAVA_OPTS:--Djava.awt.headless=true -Dfile.encoding=UTF-8 -server -Xss1024k -Djavax.accessibility.assistive_technologies=''}"
      SMTP_FROM: "${SMTP_FROM:-noreply@localhost}"
      SMTP_HOST: "${SMTP_HOST:-host.docker.internal}"
      SMTP_PORT: "${SMTP_PORT:-25}"
    secrets:
      - source: ARCHIVESSPACE_DB_PASSWORD
        target: DB_PASSWORD
    volumes:
      - archivesspace-data:/archivesspace/data:rw
    depends_on:
      database-init:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
      solr:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/ || exit 1"]
      interval: 1m
      timeout: 5s
      retries: 5
      start_period: 5m

  database-init:
    image: libops/base:3.2.2.0@sha256:dcbc45a6f61b41d6e849c8920ebca58f26cd65414b3efafbaabc5d04fa95af9d
    restart: "no"
    networks:
      default:
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: "${DB_NAME:-archivesspace}"
      DB_USER: "${DB_USER:-archivesspace}"
      DB_CHARACTER_SET: utf8mb4
      DB_COLLATION: utf8mb4_unicode_ci
    secrets:
      - source: DB_ROOT_PASSWORD
      - source: ARCHIVESSPACE_DB_PASSWORD
        target: DB_PASSWORD
    entrypoint: /usr/local/bin/init-database.sh
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    <<: *common
    image: libops/mariadb:11@sha256:23619b0490e895e79fd36c84fe2294107708a39bd64d06dabcd57c344c5a4620
    secrets:
      - source: DB_ROOT_PASSWORD
    volumes:
      - mariadb-data:/var/lib/mysql:rw

  solr:
    <<: *common
    image: libops/archivesspace-solr:4.2.1@sha256:68a9c3a013df8957db295c218cf133fee5bbe601c470535ab1356f78932b8c5e
    environment:
      SOLR_JAVA_MEM: "-Xms1g -Xmx1g"
    volumes:
      - solr-data:/var/solr:rw
